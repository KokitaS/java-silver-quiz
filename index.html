<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Java Silver 練習</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #ffffff; --fg: #1b1f24; --muted: #5b6570; --card: #f3f5f8; --line: #d8dde4;
  --accent: #1f6feb; --accent-fg: #ffffff;
  --ok: #1a7f37; --ok-bg: #dafbe1; --ng: #cf222e; --ng-bg: #ffebe9; --warn: #bf8700;
  --code-bg: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1419; --fg: #e6edf3; --muted: #9aa5b1; --card: #1a212b; --line: #2d3641;
    --accent: #4c8dff; --accent-fg: #0b0f14;
    --ok: #56d364; --ok-bg: #12301b; --ng: #ff7b72; --ng-bg: #3a1618; --warn: #e3b341;
    --code-bg: #161b22;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
#app { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
h1 { font-size: 1.5rem; margin: 8px 0 16px; }
h2 { font-size: 1rem; color: var(--muted); margin: 24px 0 8px; font-weight: 600; }
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.card { background: var(--card); border-radius: 12px; padding: 12px 8px; text-align: center; }
.card .num { font-size: 1.6rem; font-weight: 700; }
.card .label { font-size: .75rem; color: var(--muted); }
.weekbox { margin-top: 16px; }
.weektext { font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.bar { height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); border-radius: 4px; }
.fill.warn { background: var(--warn); }
.mode {
  display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 56px;
  padding: 12px 16px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
}
a.mode { color: inherit; text-decoration: none; }
.mode .modename { font-weight: 700; }
.mode .modesub { color: var(--muted); }
.mode.alt { background: transparent; }
.note { color: var(--muted); font-size: .85rem; margin: 8px 0; }
.links { display: flex; gap: 16px; margin-top: 16px; }
.link { background: none; border: none; color: var(--accent); padding: 8px 0; font-size: .9rem; }
.topbar { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
.meta { display: flex; justify-content: space-between; gap: 8px; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
.tag { text-align: right; }
.question { white-space: pre-wrap; margin: 8px 0; font-weight: 600; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font-size: .85rem; line-height: 1.5; margin: 8px 0 16px; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.option {
  display: flex; gap: 12px; align-items: flex-start; width: 100%; min-height: 52px; text-align: left;
  padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
}
.option .no { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--line); display: grid; place-items: center; font-size: .85rem; font-weight: 700; }
.option .text { flex: 1; white-space: pre-wrap; word-break: break-word; }
.option.right { border-color: var(--ok); background: var(--ok-bg); }
.option.wrong { border-color: var(--ng); background: var(--ng-bg); }
.option.dim { opacity: .55; }
.result { font-weight: 700; padding: 8px 12px; border-radius: 8px; margin-bottom: 8px; }
.result.ok { color: var(--ok); background: var(--ok-bg); }
.result.ng { color: var(--ng); background: var(--ng-bg); }
.explain { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 12px; white-space: pre-wrap; }
.textbook { display: inline-block; color: var(--accent); margin-bottom: 16px; padding: 8px 0; }
.primary, .secondary {
  display: block; width: 100%; min-height: 52px; border-radius: 12px; margin-top: 8px; font-weight: 700;
}
.primary { background: var(--accent); color: var(--accent-fg); border: none; }
.secondary { background: transparent; border: 1px solid var(--line); }
.big { font-size: 1.6rem; font-weight: 700; margin: 8px 0; }
.row { margin-bottom: 12px; }
.rowtop { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; margin-bottom: 4px; }
textarea { width: 100%; background: var(--code-bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: .8rem ui-monospace, monospace; }
</style>
</head>
<body>
<main id="app"><p class="note">読み込み中…</p></main>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
